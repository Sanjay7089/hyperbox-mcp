name: CI

on:
  push:
    # The v0.3 work happens on its own branch and is not merged until it
    # has passed on Windows and in a real MCP client, so the branch needs
    # the same three-OS host checks main gets.
    branches: [main, v0.3-engine]
  pull_request:

jobs:
  host-checks:
    # The host-side suite: file locking, path handling, config generation,
    # environment resolution, log rotation, engine discovery.
    #
    # It creates no container, but parts of it do need an engine to answer.
    # GitHub's ubuntu runners ship Docker; the macOS and Windows ones do
    # not, so those set HYPERBOX_SKIP_ENGINE_CHECKS and the engine-dependent
    # checks report SKIP instead of FAIL. Skips are never counted as passes.
    #
    # It is NOT the full acceptance suite. Containment, resource limits and
    # the lifecycle are proven against real Docker and Podman containers,
    # which is a local step -- see CONTRIBUTING.md.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e .

      - name: Host portability suite
        # ubuntu runners have Docker, so they check the engine paths for real.
        env:
          HYPERBOX_SKIP_ENGINE_CHECKS: ${{ matrix.os == 'ubuntu-latest' && '0' || '1' }}
        run: python tests/verify_platform.py

      - name: The CLI runs without a container engine
        run: |
          hyperbox --version
          hyperbox config --format json

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel and sdist
        run: |
          pip install build twine
          python -m build
          twine check dist/*
