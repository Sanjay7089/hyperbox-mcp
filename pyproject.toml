[project]
name = "sandbox-mcp"
version = "0.1.0"
description = "MCP server that lets any agent run code in a disposable Docker/Podman container before it touches your real project."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp==2.14.7",
    "llm-sandbox[docker,podman]>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sandbox-mcp = "sandbox_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
