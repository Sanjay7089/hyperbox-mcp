[project]
name = "hyperbox-mcp"
version = "0.2.0"
description = "MCP server that lets any agent run code in a disposable Docker/Podman container before it touches your real project."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=4.0.2,<5",
    "llm-sandbox[docker,podman]>=0.3.44,<0.4",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
hyperbox = "hyperbox_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
